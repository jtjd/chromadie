name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Updated to match GitHub Actions default
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint project
        run: npx eslint .
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Check Svelte and JavaScript types
        run: npm run check
      - name: Test balance boundaries
        run: npm test
      - name: Check profile parity certification
        run: npm run check:profile-certification
      - name: Check internal links
        run: npm run check:links
      - name: Check balance drift
        run: npm run check:balance-drift
      - name: Check catalog drift
        run: npm run check:catalog-drift
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_KEY }}
      - name: Build project
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_KEY }}
          VITE_CLOUDFLARE_SITE_KEY: ${{ secrets.VITE_CLOUDFLARE_SITE_KEY }}
      - name: Check compiled responsive CSS
        run: npm run check:responsive-build
      - name: Check route performance budgets
        run: npm run check:performance
      - name: Check built CSP hashes
        run: npm run check:csp

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Start local Supabase
        run: npx supabase start
      - name: Replay migrations and seed
        run: npm run db:reset
      - name: Lint database
        run: npx supabase db lint --local --level warning --fail-on warning
      - name: Run database security checks
        run: npm run check:db-security
      - name: Check username policy drift
        run: npm run check:username-policy-drift
      - name: Run progression database behavior checks
        run: npm run check:progression-db
      - name: Check SQL and JavaScript scoring parity
        run: npm run check:scoring-parity
      - name: Install Chromium for production browser smoke
        run: |
          sudo apt-get update
          sudo apt-get install --yes chromium
      - name: Export local Supabase browser credentials
        shell: bash
        run: |
          npx supabase status -o env > /tmp/chromadie-supabase-status.env
          api_url=$(awk -F= '$1 == "API_URL" { print $2 }' /tmp/chromadie-supabase-status.env | tr -d "'\"")
          anon_key=$(awk -F= '$1 == "ANON_KEY" { print $2 }' /tmp/chromadie-supabase-status.env | tr -d "'\"")
          test -n "$api_url"
          test -n "$anon_key"
          {
            echo "VITE_SUPABASE_URL=$api_url"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$anon_key"
          } >> "$GITHUB_ENV"
      - name: Run production browser smoke
        run: npm run test:browser:production
      - name: Run progression browser smoke
        run: npm run test:browser:progression
      - name: Upload production browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-smoke-evidence
          path: |
            /tmp/chromadie-profile-studio-smoke-*
            /tmp/chromadie-progression-smoke-*
          if-no-files-found: ignore
