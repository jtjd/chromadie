name: Public release preflight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      # These credentials read the actual Pages project configuration. Do not
      # replace them with a mirrored PREVIEW_PROTECTION variable: the check
      # must fail when Cloudflare's runtime setting is not public.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify the live Cloudflare Pages release switch
        run: npm run check:release-config:cloudflare
