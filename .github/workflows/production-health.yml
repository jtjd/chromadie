name: Production health

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check production pages, media assets, and Auth reachability
        env:
          CHROMADIE_HEALTH_SITE_ORIGIN: https://chm.lol
          CHROMADIE_SUPABASE_AUTH_HEALTH_URL: https://auuoibdmjylrnekqquku.supabase.co/auth/v1/health
        run: node scripts/check-production-health.mjs
